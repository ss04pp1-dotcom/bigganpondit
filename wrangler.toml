# Cloudflare Workers configuration — নম্বর সংগ্রহক ও রিপোর্ট সফটওয়্যার
# Deploy: bunx @opennextjs/cloudflare build && bunx wrangler deploy
# (see DEPLOY.md for the full production guide)

name = "academy-marks-system"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# OpenNext (Next.js on Cloudflare Workers) output
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"

# ---- Cloudflare D1 (SQLite database) ----
[[d1_databases]]
binding = "DB"
database_name = "academy-marks"
database_id = "abcb9f52-a073-4103-af43-59e1ec825b0c"
migrations_dir = "db/migrations"

# ---- Cloudflare R2 (file storage: photos / logo / signatures / backups) ----
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "academy-assets"

[vars]
APP_URL = "https://academy-marks-system.salman61902.workers.dev"
# Set the real secret in production:
#   bunx wrangler secret put AUTH_SECRET
#   bunx wrangler secret put ADMIN_USERNAME
#   bunx wrangler secret put ADMIN_PASSWORD
# Push notifications (FCM HTTP v1) + cron — see docs/FCM_SETUP.md:
#   bunx wrangler secret put FCM_SERVICE_ACCOUNT   # full service-account JSON key
#   bunx wrangler secret put CRON_SECRET            # random string for the cron endpoint

# ---- Cron Triggers: push-notification queue processor ----
# Every 5 minutes the Worker's scheduled() handler (injected into
# .open-next/worker.js by scripts/patch-worker.mjs after build) calls
# POST /api/cron/push with the CRON_SECRET. The processor is
# claim-guarded and idempotent, so overlapping or missed ticks are safe.
[triggers]
crons = ["*/5 * * * *"]

# Preview environment — MUST use its own database & bucket.
# Previously [env.preview] only overrode `name`, so it INHERITED the
# production D1 database (academy-marks) and R2 bucket: deploying or testing
# preview wrote directly to LIVE production data.
# Create the preview resources once, then fill in the ids below:
#   bunx wrangler d1 create academy-marks-preview
#   bunx wrangler r2 bucket create academy-assets-preview
[env.preview]
name = "academy-marks-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "academy-marks-preview"
database_id = "REPLACE_WITH_PREVIEW_D1_DATABASE_ID"
migrations_dir = "db/migrations"

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "academy-assets-preview"
